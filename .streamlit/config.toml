
# ==========================================
# PrestServ - Configuração visual
# ==========================================

[theme]

# Tipografia geral
font = "sans-serif"
headingFont = "sans-serif"

baseFontSize = 16
baseFontWeight = 400

# Tamanhos dos títulos
headingFontSizes = [
    "2rem",
    "1.5rem",
    "1.25rem",
    "1.1rem",
    "1rem",
    "0.9rem"
]

# Indicadores numéricos
metricValueFontSize = "2rem"
metricValueFontWeight = 600


# ==========================================
# Tema claro
# ==========================================

[theme.light]

primaryColor = "#526579"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F6"
textColor = "#242424"
borderColor = "#D5DDE5"


# ==========================================
# Tema escuro
# ==========================================

[theme.dark]

primaryColor = "#A8BBD0"
backgroundColor = "#111820"
secondaryBackgroundColor = "#202A35"
textColor = "#F1F3F5"
borderColor = "#485563"
